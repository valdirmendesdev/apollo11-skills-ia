services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: apollo
      POSTGRES_PASSWORD: apollo
      POSTGRES_DB: apollo
    ports:
      - "5544:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apollo"]
      interval: 2s
      timeout: 3s
      retries: 20
